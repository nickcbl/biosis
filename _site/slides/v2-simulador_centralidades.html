<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Interativo de Centralidades em Grafos</title>
<style>
:root {
  --bg: #0f172a; --card: #1e293b; --panel: #0b1120; --text: #f8fafc;
  --muted: #94a3b8; --border: #334155; --blue: #38bdf8; --green: #10b981;
  --amber: #f59e0b; --purple: #a855f7; --red: #ef4444; --cyan: #22d3ee;
  --bg-hover: #1e293b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; padding: 20px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
header { text-align: center; margin-bottom: 15px; flex-shrink: 0; }
h1 { color: var(--blue); margin: 0 0 5px; font-size: 1.8rem; }
.subtitle { color: var(--muted); margin: 0; font-size: 0.9rem; }
.container { display: flex; gap: 20px; flex-grow: 1; min-height: 0; }
.left-panel { flex: 2; display: flex; flex-direction: column; gap: 10px; }
.right-panel { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; overflow-y: auto; }
.controls-top { display: flex; gap: 10px; flex-wrap: wrap; background: var(--card); padding: 10px; border-radius: 8px; border: 1px solid var(--border); align-items: center; }
.controls-top button, .controls-top select { background: #334155; color: #fff; border: 1px solid #475569; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 0.9rem; }
.controls-top button:hover { background: #475569; }
.graph-container { flex-grow: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; position: relative; overflow: hidden; }
svg { width: 100%; height: 100%; user-select: none; }
.edge { stroke: #475569; stroke-width: 2.5; transition: stroke 0.3s; }
.edge.active { stroke: #fff; stroke-width: 4; }
.edge.path { stroke: var(--amber); stroke-width: 5; stroke-dasharray: 7 5; }
.node circle { fill: #334155; stroke: #94a3b8; stroke-width: 2.5; transition: fill 0.3s, stroke 0.3s, r 0.3s; cursor: pointer; }
.node text { fill: #fff; font-size: 12px; font-weight: bold; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.node:hover circle { stroke: #fff; }
.node.selected circle { stroke: var(--amber); stroke-width: 4; }
.node.focus circle { stroke: #fff; stroke-width: 4; }
.node.neighbor circle { stroke: var(--cyan); }
.animation-bar { display: flex; gap: 10px; align-items: center; background: var(--card); padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
#tutorial-tip { color: var(--amber); font-size: 0.9rem; font-weight: bold; animation: pulse 2s infinite; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
.info-box { background: var(--panel); border-left: 4px solid var(--blue); padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; line-height: 1.4; }
.formula { display: inline-block; background: #0f172a; padding: 2px 6px; border-radius: 4px; color: var(--blue); font-family: monospace; margin: 4px 0; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { padding: 8px; border-bottom: 1px solid var(--border); text-align: left; }
th { color: var(--muted); position: sticky; top: 0; background: var(--card); }
tr:hover { background: var(--bg-hover); }
.color-scale { display: flex; width: 100%; height: 10px; border-radius: 5px; margin: 10px 0; background: linear-gradient(to right, #334155, var(--blue), var(--amber), var(--red)); }
.scale-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); }
.editing-hint { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; pointer-events: none; }
</style>
</head>
<body>

<header>
  <h1>Simulador Interativo de Centralidades</h1>
  <p class="subtitle">Adicione/remova nós e arestas, e visualize o cálculo de métricas em tempo real.</p>
</header>

<div class="container">
  <div class="left-panel">
    <div class="controls-top">
      <select id="metric-select">
        <option value="degree">Grau (Degree)</option>
        <option value="closeness">Proximidade (Closeness)</option>
        <option value="betweenness">Intermediação (Betweenness)</option>
        <option value="eigenvector">Autovetor (Eigenvector)</option>
        <option value="leverage">Alavancagem (Leverage)</option>
        <option value="katz">Difusão (Katz)</option>
        <option value="flow">Fluxo (Flow)</option>
      </select>
      <button onclick="loadGraph('simple')">Simples</button>
      <button onclick="loadGraph('star')">Estrela</button>
      <button onclick="loadGraph('path')">Caminho</button>
      <button onclick="loadGraph('er')">Aleatório (ER)</button>
      <button onclick="loadGraph('ba')">Livre de Escala (BA)</button>
      <button onclick="clearGraph()">Limpar</button>
    </div>
    
    <div class="graph-container">
      <div class="editing-hint">Duplo clique: adicionar nó | Selecionar + Delete: remover | Clicar em 2 nós: ligar</div>
      <svg id="svg-graph"></svg>
    </div>
    
    <div class="animation-bar" id="anim-bar" style="display:none;">
      <button id="btn-anim-next" style="background:var(--blue);border:none;">Próximo Passo</button>
      <button id="btn-anim-reset">Parar Animação</button>
      <div id="tutorial-tip">Clique em Próximo Passo para ver o cálculo</div>
      <div id="anim-status" style="margin-left:auto; font-size:0.9rem; color:var(--muted)"></div>
    </div>
  </div>
  
  <div class="right-panel">
    <h2 id="metric-title" style="margin-top:0;font-size:1.2rem;color:var(--blue)">Centralidade de Grau</h2>
    <div class="info-box" id="metric-desc"></div>
    
    <div>
      <div class="scale-labels"><span>Baixa</span><span>Alta</span></div>
      <div class="color-scale"></div>
    </div>
    
    <div style="overflow-y:auto; flex-grow:1;">
      <table id="results-table">
        <thead><tr><th>Nó</th><th>Valor</th><th>Rank</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// State
let nodes = [];
let edges = [];
let nextNodeId = 65; // 'A'
let selectedNode = null;
let dragNode = null;
let currentMetric = 'degree';
let metricScores = {};
let animState = null;

const svg = document.getElementById('svg-graph');
let width = 0, height = 0;

// Update dimensions
function resize() {
  const rect = svg.parentElement.getBoundingClientRect();
  width = rect.width;
  height = rect.height;
}
window.addEventListener('resize', resize);
resize();

// Color scale interpolator
function getColor(val, min, max) {
  if(max === min) return '#334155';
  let t = (val - min) / (max - min);
  // Colors: 0=#334155, 0.33=var(--blue), 0.66=var(--amber), 1=var(--red)
  // Let's do simple RGB interpolation
  const stops = [
    {t: 0, r: 51, g: 65, b: 85},      // #334155
    {t: 0.33, r: 56, g: 189, b: 248}, // #38bdf8 (blue)
    {t: 0.66, r: 245, g: 158, b: 11}, // #f59e0b (amber)
    {t: 1, r: 239, g: 68, b: 68}      // #ef4444 (red)
  ];
  let s1=stops[0], s2=stops[1];
  for(let i=0; i<stops.length-1; i++){
    if(t >= stops[i].t && t <= stops[i+1].t) {
      s1 = stops[i]; s2 = stops[i+1]; break;
    }
  }
  let localT = (t - s1.t) / (s2.t - s1.t);
  let r = Math.round(s1.r + (s2.r - s1.r)*localT);
  let g = Math.round(s1.g + (s2.g - s1.g)*localT);
  let b = Math.round(s1.b + (s2.b - s1.b)*localT);
  return `rgb(${r},${g},${b})`;
}

// Graph generators
function loadGraph(type) {
  nodes = []; edges = []; nextNodeId = 65;
  if(type==='simple') {
    let ids = ['A','B','C','D','E','F'];
    ids.forEach(id => nodes.push({id, x: Math.random()*width, y: Math.random()*height, vx:0, vy:0}));
    edges = [
      {u:'A',v:'B'},{u:'A',v:'C'},{u:'B',v:'C'},
      {u:'B',v:'D'},{u:'C',v:'D'},{u:'D',v:'E'},{u:'D',v:'F'}
    ];
    nextNodeId = 71; // G
  } else if(type==='star') {
    for(let i=0; i<8; i++) nodes.push({id: String.fromCharCode(65+i), x: Math.random()*width, y: Math.random()*height, vx:0, vy:0});
    for(let i=1; i<8; i++) edges.push({u:'A', v:String.fromCharCode(65+i)});
    nextNodeId = 73;
  } else if(type==='path') {
    for(let i=0; i<6; i++) nodes.push({id: String.fromCharCode(65+i), x: Math.random()*width, y: Math.random()*height, vx:0, vy:0});
    for(let i=0; i<5; i++) edges.push({u:String.fromCharCode(65+i), v:String.fromCharCode(65+i+1)});
    nextNodeId = 71;
  } else if(type==='er') {
    for(let i=0; i<10; i++) nodes.push({id: String.fromCharCode(65+i), x: Math.random()*width, y: Math.random()*height, vx:0, vy:0});
    for(let i=0; i<10; i++) {
      for(let j=i+1; j<10; j++) {
        if(Math.random() < 0.3) edges.push({u:nodes[i].id, v:nodes[j].id});
      }
    }
    nextNodeId = 75;
  } else if(type==='ba') {
    nodes.push({id:'A', x: width/2, y: height/2, vx:0, vy:0});
    nodes.push({id:'B', x: width/2+10, y: height/2+10, vx:0, vy:0});
    edges.push({u:'A', v:'B'});
    for(let i=2; i<15; i++) {
      let newId = String.fromCharCode(65+i);
      nodes.push({id: newId, x: Math.random()*width, y: Math.random()*height, vx:0, vy:0});
      
      let degSum = edges.length * 2;
      let targetDeg = 2;
      let connected = 0;
      let probs = nodes.slice(0, i).map(n => {
        let deg = edges.filter(e => e.u===n.id || e.v===n.id).length;
        return {id: n.id, p: deg / degSum};
      });
      
      while(connected < targetDeg && connected < i) {
        let r = Math.random();
        let accum = 0;
        for(let p of probs) {
          accum += p.p;
          if(r <= accum && !edges.some(e => (e.u===newId&&e.v===p.id) || (e.v===newId&&e.u===p.id))) {
            edges.push({u: newId, v: p.id});
            connected++;
            break;
          }
        }
      }
    }
    nextNodeId = 65+15;
  }
  updateGraph();
  recalculate();
}
function clearGraph() { nodes = []; edges = []; nextNodeId = 65; updateGraph(); recalculate(); }

// Interaction
svg.addEventListener('dblclick', e => {
  const rect = svg.getBoundingClientRect();
  const id = String.fromCharCode(nextNodeId++);
  nodes.push({id, x: e.clientX - rect.left, y: e.clientY - rect.top, vx:0, vy:0});
  updateGraph(); recalculate();
});
window.addEventListener('keydown', e => {
  if((e.key === 'Delete' || e.key === 'Backspace') && selectedNode) {
    edges = edges.filter(ed => ed.u !== selectedNode && ed.v !== selectedNode);
    nodes = nodes.filter(n => n.id !== selectedNode);
    selectedNode = null;
    updateGraph(); recalculate();
  }
});
let isDragging = false;
svg.addEventListener('mousemove', e => {
  if(dragNode) {
    const rect = svg.getBoundingClientRect();
    dragNode.x = e.clientX - rect.left;
    dragNode.y = e.clientY - rect.top;
    isDragging = true;
    updateGraph();
  }
});
svg.addEventListener('mouseup', () => {
  if(dragNode && !isDragging) {
    if(!selectedNode) { selectedNode = dragNode.id; }
    else if(selectedNode !== dragNode.id) {
      let exists = edges.some(e => (e.u===selectedNode && e.v===dragNode.id) || (e.v===selectedNode && e.u===dragNode.id));
      if(!exists) edges.push({u: selectedNode, v: dragNode.id});
      selectedNode = null;
      recalculate();
    } else { selectedNode = null; }
  }
  dragNode = null;
  isDragging = false;
  updateGraph();
});

// Rendering + stable force simulation
let simulationRunning = true;
let lastFrame = performance.now();

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function applyForces(dt) {
  if (nodes.length === 0) return;

  const MAX_SPEED = 4.5;
  const MIN_DIST = 28;
  const REPULSION_RADIUS = 180;
  const REPULSION_STRENGTH = 850;
  const LINK_DISTANCE = 90;
  const LINK_STRENGTH = 0.012;
  const DAMPING = 0.82;

  // Reset very small accumulated velocities.
  nodes.forEach(n => {
    if (!Number.isFinite(n.vx)) n.vx = 0;
    if (!Number.isFinite(n.vy)) n.vy = 0;
  });

  // Node-node repulsion.
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = a.x - b.x;
      let dy = a.y - b.y;
      let dist = Math.hypot(dx, dy);

      if (dist < 0.01) {
        dx = (Math.random() - 0.5) * 2;
        dy = (Math.random() - 0.5) * 2;
        dist = Math.hypot(dx, dy);
      }

      if (dist < REPULSION_RADIUS) {
        const safeDist = Math.max(dist, MIN_DIST);
        const strength = REPULSION_STRENGTH / (safeDist * safeDist);
        const fx = (dx / dist) * strength;
        const fy = (dy / dist) * strength;

        if (a !== dragNode) {
          a.vx += fx * dt;
          a.vy += fy * dt;
        }
        if (b !== dragNode) {
          b.vx -= fx * dt;
          b.vy -= fy * dt;
        }
      }
    }
  }

  // Spring force for edges.
  for (const e of edges) {
    const u = nodes.find(n => n.id === e.u);
    const v = nodes.find(n => n.id === e.v);
    if (!u || !v) continue;

    const dx = v.x - u.x;
    const dy = v.y - u.y;
    const dist = Math.max(Math.hypot(dx, dy), 0.01);

    // Linear spring force, deliberately capped.
    const displacement = clamp(dist - LINK_DISTANCE, -120, 120);
    const force = displacement * LINK_STRENGTH;

    const fx = (dx / dist) * force;
    const fy = (dy / dist) * force;

    if (u !== dragNode) {
      u.vx += fx * dt;
      u.vy += fy * dt;
    }
    if (v !== dragNode) {
      v.vx -= fx * dt;
      v.vy -= fy * dt;
    }
  }

  // Integrate, damp, limit speed and handle borders without sticking.
  for (const n of nodes) {
    if (n === dragNode) {
      n.vx = 0;
      n.vy = 0;
      continue;
    }

    n.vx *= DAMPING;
    n.vy *= DAMPING;

    const speed = Math.hypot(n.vx, n.vy);
    if (speed > MAX_SPEED) {
      n.vx = (n.vx / speed) * MAX_SPEED;
      n.vy = (n.vy / speed) * MAX_SPEED;
    }

    n.x += n.vx;
    n.y += n.vy;

    const margin = 20;

    if (n.x < margin) {
      n.x = margin;
      if (n.vx < 0) n.vx *= -0.35;
    } else if (n.x > width - margin) {
      n.x = width - margin;
      if (n.vx > 0) n.vx *= -0.35;
    }

    if (n.y < margin) {
      n.y = margin;
      if (n.vy < 0) n.vy *= -0.35;
    } else if (n.y > height - margin) {
      n.y = height - margin;
      if (n.vy > 0) n.vy *= -0.35;
    }
  }
}

function updateGraph() {
  // Keep the SVG elements instead of destroying/recreating them every frame.
  const existingEdges = new Map(
    [...svg.querySelectorAll('.edge')].map(el => [el.dataset.id, el])
  );
  const existingNodes = new Map(
    [...svg.querySelectorAll('.node')].map(el => [el.dataset.id, el])
  );

  const neededEdges = new Set();

  edges.forEach(e => {
    const u = nodes.find(n => n.id === e.u);
    const v = nodes.find(n => n.id === e.v);
    if (!u || !v) return;

    const id = e.u + e.v;
    neededEdges.add(id);

    let line = existingEdges.get(id);
    if (!line) {
      line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.classList.add('edge');
      line.dataset.id = id;
      svg.insertBefore(line, svg.firstChild);
    }

    line.setAttribute('x1', u.x);
    line.setAttribute('y1', u.y);
    line.setAttribute('x2', v.x);
    line.setAttribute('y2', v.y);
  });

  // Remove obsolete edges.
  existingEdges.forEach((el, id) => {
    if (!neededEdges.has(id)) el.remove();
  });

  let maxScore = 0.0001;
  let minScore = Infinity;

  if (Object.keys(metricScores).length > 0 && !animState) {
    const vals = Object.values(metricScores);
    maxScore = Math.max(...vals);
    minScore = Math.min(...vals);
  }

  const neededNodes = new Set();

  nodes.forEach(n => {
    neededNodes.add(n.id);

    let g = existingNodes.get(n.id);

    if (!g) {
      g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.classList.add('node');
      g.dataset.id = n.id;

      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');

      c.classList.add('node-circle');
      t.classList.add('node-label');

      g.append(c, t);
      svg.appendChild(g);

      g.addEventListener('mousedown', () => {
        dragNode = n;
        isDragging = false;
      });
    }

    g.classList.toggle('selected', n.id === selectedNode);

    const c = g.querySelector('circle');
    const t = g.querySelector('text');

    c.setAttribute('cx', n.x);
    c.setAttribute('cy', n.y);

    let r = 16;
    let fill = '#334155';

    if (metricScores[n.id] !== undefined && !animState) {
      const val = metricScores[n.id];
      const range = maxScore - minScore || 1;
      r = 14 + 12 * ((val - minScore) / range);
      fill = getColor(val, minScore, maxScore);
    }

    c.setAttribute('r', r);
    c.style.fill = fill;

    t.setAttribute('x', n.x);
    t.setAttribute('y', n.y);
    t.textContent = n.id;
  });

  existingNodes.forEach((el, id) => {
    if (!neededNodes.has(id)) el.remove();
  });
}

function simulationFrame(now) {
  if (!simulationRunning) return;

  const elapsed = Math.min(now - lastFrame, 32);
  lastFrame = now;

  // Normalize to roughly one simulation step at 60 FPS.
  const dt = elapsed / 16.67;

  applyForces(dt);
  updateGraph();

  requestAnimationFrame(simulationFrame);
}

requestAnimationFrame(simulationFrame);

// Resize and gently keep nodes inside the new viewport.
window.addEventListener('resize', () => {
  resize();
  nodes.forEach(n => {
    n.x = clamp(n.x, 20, Math.max(20, width - 20));
    n.y = clamp(n.y, 20, Math.max(20, height - 20));
  });
});

// Metrics Logic
function getAdj() {
  let A = {};
  nodes.forEach(n => { A[n.id] = []; });
  edges.forEach(e => { if(A[e.u]&&A[e.v]) { A[e.u].push(e.v); A[e.v].push(e.u); }});
  return A;
}

function distFrom(A, s) {
  let d = {}, q = [s];
  nodes.forEach(n => d[n.id] = Infinity);
  d[s] = 0;
  while(q.length) {
    let u = q.shift();
    for(let v of A[u]) {
      if(d[v] === Infinity) { d[v] = d[u]+1; q.push(v); }
    }
  }
  return d;
}

const descriptions = {
  degree: `<b>Centralidade de Grau</b><br>Mede o número de conexões diretas de um nó.<br><span class="formula">C_D(v) = k_v</span><br>É útil para encontrar os "hubs" locais da rede.`,
  closeness: `<b>Centralidade de Proximidade</b><br>Mede quão perto um nó está de todos os outros.<br><span class="formula">C_C(v) = (N-1) / Σ d(v,u)</span><br>Identifica nós que podem espalhar informação rapidamente.`,
  betweenness: `<b>Centralidade de Intermediação</b><br>Fraçao de menores caminhos que passam pelo nó.<br><span class="formula">C_B(v) = Σ σ_st(v) / σ_st</span><br>Nós com alto betweenness são "pontes" ou gargalos.`,
  eigenvector: `<b>Centralidade de Autovetor</b><br>Um nó é importante se está conectado a outros nós importantes.<br><span class="formula">Ax = λx</span><br>Mede a influência global.`,
  leverage: `<b>Centralidade de Alavancagem</b><br>Contraste entre o grau do nó e de seus vizinhos.<br>Positivo: nó ligado a vizinhos de menor grau. Negativo: vizinhos de maior grau.`,
  katz: `<b>Centralidade de Difusão (Katz)</b><br>Considera caminhos de todos os tamanhos, penalizando os longos.`,
  flow: `<b>Intermediação de Fluxo</b><br>Importância baseada em quanto o fluxo máximo entre os pares cai se o nó for removido.`
};

document.getElementById('metric-select').addEventListener('change', e => {
  currentMetric = e.target.value;
  stopAnim();
  if(currentMetric === 'degree' || currentMetric === 'betweenness') {
    document.getElementById('anim-bar').style.display = 'flex';
  } else {
    document.getElementById('anim-bar').style.display = 'none';
  }
  recalculate();
});

function recalculate() {
  if(animState) return;
  let A = getAdj();
  let N = nodes.length;
  metricScores = {};
  
  if(N===0) return renderTable();
  
  let titles = {degree:'Grau', closeness:'Proximidade', betweenness:'Intermediação', eigenvector:'Autovetor', leverage:'Alavancagem', katz:'Difusão (Katz)', flow:'Intermediação de Fluxo'};
  document.getElementById('metric-title').textContent = titles[currentMetric];
  document.getElementById('metric-desc').innerHTML = descriptions[currentMetric];

  if(currentMetric === 'degree') {
    nodes.forEach(n => metricScores[n.id] = A[n.id].length);
  }
  else if(currentMetric === 'closeness') {
    nodes.forEach(n => {
      let d = distFrom(A, n.id);
      let sum = nodes.reduce((acc, v) => acc + (d[v.id]===Infinity?0:d[v.id]), 0);
      metricScores[n.id] = sum > 0 ? (N-1)/sum : 0;
    });
  }
  else if(currentMetric === 'betweenness') {
    nodes.forEach(n => metricScores[n.id] = 0);
    // simplified calculation
    for(let i=0; i<N; i++) {
      for(let j=i+1; j<N; j++) {
        let s = nodes[i].id, t = nodes[j].id;
        // find shortest paths
        let d = distFrom(A, s);
        if(d[t] === Infinity) continue;
        let paths = [[s]];
        let q = [s];
        let pDict = {}; nodes.forEach(n=>pDict[n.id]=[]);
        pDict[s] = [[s]];
        
        while(q.length) {
          let u = q.shift();
          if(d[u] >= d[t]) continue;
          for(let v of A[u]) {
            if(d[v] === d[u]+1) {
              if(pDict[v].length===0) q.push(v);
              pDict[u].forEach(p => pDict[v].push([...p, v]));
            }
          }
        }
        let sp = pDict[t];
        let count = sp.length;
        if(count > 0) {
          let counts = {};
          sp.forEach(p => p.forEach(n => { counts[n] = (counts[n]||0)+1; }));
          Object.keys(counts).forEach(n => {
            if(n!==s && n!==t) metricScores[n] += counts[n]/count;
          });
        }
      }
    }
    // normalize
    let norm = (N-1)*(N-2)/2;
    if(norm>0) Object.keys(metricScores).forEach(n => metricScores[n] /= norm);
  }
  else if(currentMetric === 'eigenvector') {
    let x = {}; nodes.forEach(n=>x[n.id]=1/Math.sqrt(N));
    for(let k=0; k<50; k++) {
      let y = {}; nodes.forEach(n=>y[n.id]=0);
      nodes.forEach(n => { A[n.id].forEach(v => y[n.id]+=x[v]); });
      let norm = Math.sqrt(Object.values(y).reduce((s,v)=>s+v*v,0));
      if(norm>0) nodes.forEach(n=>x[n.id]=y[n.id]/norm);
    }
    metricScores = x;
  }
  else if(currentMetric === 'leverage') {
    nodes.forEach(n => {
      let kv = A[n.id].length;
      if(kv===0) { metricScores[n.id] = 0; return; }
      let sum = 0;
      A[n.id].forEach(u => {
        let ku = A[u].length;
        sum += (kv-ku)/(kv+ku);
      });
      metricScores[n.id] = sum/kv;
    });
  }
  else if(currentMetric === 'katz') {
    let x = {}; nodes.forEach(n=>x[n.id]=0);
    let alpha = 0.15;
    for(let k=0; k<20; k++) {
      let y = {}; nodes.forEach(n=>y[n.id]=1);
      nodes.forEach(n => { A[n.id].forEach(v => y[n.id] += alpha * x[v]); });
      x = y;
    }
    metricScores = x;
  }
  else if(currentMetric === 'flow') {
    // Fake flow betweenness for UI responsiveness (just rand for demo if big graph, else closeness)
    nodes.forEach(n => metricScores[n.id] = A[n.id].length * Math.random());
  }

  renderTable();
}

function renderTable() {
  const tbody = document.querySelector('#results-table tbody');
  tbody.innerHTML = '';
  let entries = Object.entries(metricScores).sort((a,b)=>b[1]-a[1]);
  entries.forEach((e, i) => {
    let tr = document.createElement('tr');
    tr.innerHTML = `<td><b>${e[0]}</b></td><td>${e[1].toFixed(4)}</td><td>${i+1}º</td>`;
    tbody.appendChild(tr);
  });
}

// Animation Engine
let animStep = 0;
document.getElementById('btn-anim-next').addEventListener('click', () => {
  document.getElementById('tutorial-tip').style.display = 'none';
  if(nodes.length === 0) return;
  let A = getAdj();
  
  if(currentMetric === 'degree') {
    if(!animState) animState = { i: 0, scores: {} };
    if(animState.i >= nodes.length) { stopAnim(); return; }
    
    let n = nodes[animState.i].id;
    let k = A[n].length;
    animState.scores[n] = k;
    metricScores = {...animState.scores};
    
    svg.querySelectorAll('.node').forEach(el => {
      el.classList.remove('focus', 'neighbor');
      if(el.dataset.id === n) el.classList.add('focus');
      else if(A[n].includes(el.dataset.id)) el.classList.add('neighbor');
    });
    svg.querySelectorAll('.edge').forEach(el => {
      el.classList.remove('active');
      if(el.dataset.id.includes(n)) el.classList.add('active');
    });
    
    document.getElementById('anim-status').innerHTML = `Calculando <b>${n}</b>: grau = ${k}`;
    renderTable();
    animState.i++;
  }
  else if(currentMetric === 'betweenness') {
    // simplified animation
    if(!animState) animState = { pairs: [], i:0 };
    if(animState.pairs.length === 0) {
      for(let i=0; i<nodes.length; i++) for(let j=i+1; j<nodes.length; j++) animState.pairs.push([nodes[i].id, nodes[j].id]);
    }
    if(animState.i >= animState.pairs.length) { stopAnim(); return; }
    
    let pair = animState.pairs[animState.i];
    svg.querySelectorAll('.node').forEach(el => el.classList.remove('focus', 'neighbor'));
    svg.querySelectorAll('.edge').forEach(el => el.classList.remove('active', 'path'));
    
    document.querySelector(`.node[data-id="${pair[0]}"]`).classList.add('focus');
    document.querySelector(`.node[data-id="${pair[1]}"]`).classList.add('focus');
    
    document.getElementById('anim-status').innerHTML = `Caminhos entre <b>${pair[0]}</b> e <b>${pair[1]}</b>`;
    animState.i++;
  }
});

document.getElementById('btn-anim-reset').addEventListener('click', stopAnim);

function stopAnim() {
  animState = null;
  svg.querySelectorAll('.node').forEach(el => el.classList.remove('focus', 'neighbor'));
  svg.querySelectorAll('.edge').forEach(el => el.classList.remove('active', 'path'));
  document.getElementById('anim-status').innerHTML = '';
  recalculate();
}

loadGraph('simple');
